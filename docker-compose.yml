# =============================================================================
# ESROM BirrBalance — On-prem deployment (client local server)
#
# Quick start:
#   1. cp .env.docker.example .env
#   2. Edit .env (passwords + your server LAN IP)
#   3. docker compose up -d --build
#   4. Open http://<SERVER_LAN_IP>/ from any device on the same network
# =============================================================================

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-esrom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-esrom}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-esrom} -d ${POSTGRES_DB:-esrom}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - esrom-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://${POSTGRES_USER:-esrom}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-esrom}
      DIRECT_URL: postgresql://${POSTGRES_USER:-esrom}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-esrom}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      REFRESH_TOKEN_EXPIRES_IN: ${REFRESH_TOKEN_EXPIRES_IN:-30d}
      AES_SECRET: ${AES_SECRET:?Set AES_SECRET in .env}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost}
    volumes:
      - uploads_data:/app/uploads
    expose:
      - "5000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5000/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - esrom-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      BACKEND_URL: http://backend:5000
    expose:
      - "3000"
    networks:
      - esrom-net

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    ports:
      - "${APP_PORT:-80}:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - esrom-net

volumes:
  postgres_data:
  uploads_data:

networks:
  esrom-net:
    driver: bridge
